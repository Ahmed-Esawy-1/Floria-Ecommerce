services:
    postgres:
        image: pgvector/pgvector:pg18
        container_name: floria-postgres
        environment:
            POSTGRES_DB: floria_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ahmed
        labels:
            - "org.springframework.boot.service-connection=postgres"
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d floria_db"]
            interval: 3s
            timeout: 3s
            retries: 10

    redis:
        image: redis:8-alpine
        container_name: floria-redis

        ports:
            - "6379:6379"
