spring.application.name=flowerecommerce
server.servlet.context-path=/api


spring.jpa.hibernate.ddl-auto=update

# SQL 
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.jpa.properties.hibernate.default_batch_fetch_size=50

#Spring Ai
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536


# Mail
contact.recipient=${CONTACT_RECIPIENT}
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}

# Oauth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# FRONTEND
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}


# Variables
jwt.secret=${JWT_SECRET}
file.upload-dir=upload_images

